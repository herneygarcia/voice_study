<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Voice Study" />
  <title>Lecture — Voice Study</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="manifest" href="./assets/manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="./index.html">
      <span class="brand-mark">◎</span> Voice Study
    </a>
    <div class="nav-right">
      <a class="nav-cta" href="./record.html">+ New Lecture</a>
      <button class="nav-settings-btn" data-action="open-settings" title="Settings" style="background: none; border: none; font-size: 18px; cursor: pointer; padding: 0; margin-left: 16px;">⚙️</button>
      <img src="./img/herney.jpg" alt="Herney" class="nav-avatar" />
    </div>
  </nav>
  <main class="page">
    <section class="lecture-detail">
      <header class="detail-header">
        <input id="detail-title" class="detail-title-input" type="text" value="" />
        <p id="detail-meta" class="detail-meta"></p>
      </header>

      <div class="tab-bar" role="tablist">
        <button class="tab-btn active" data-tab="transcript" type="button">Transcript</button>
        <button class="tab-btn" data-tab="summary" type="button">Summary</button>
        <button class="tab-btn" data-tab="flashcards" type="button">Flashcards</button>
        <button class="tab-btn" data-tab="podcast" type="button">Podcast</button>
        <span class="tab-underline"></span>
      </div>

      <div class="tab-panel" data-panel="transcript">
        <div class="panel-actions">
          <button id="copy-transcript-btn" class="btn btn-ghost" type="button">Copy transcript</button>
        </div>
        <textarea id="transcript-text" class="transcript-text" placeholder="No transcript recorded yet."></textarea>
      </div>

      <div class="tab-panel" data-panel="summary" hidden>
        <div class="panel-actions">
          <button id="generate-summary-btn" class="btn btn-primary" type="button">Generate Summary</button>
        </div>
        <div id="summary-loading" class="loading-bar" hidden></div>
        <div id="summary-content" class="summary-content"></div>
      </div>

      <div class="tab-panel" data-panel="flashcards" hidden>
        <div class="panel-actions">
          <button id="generate-flashcards-btn" class="btn btn-primary" type="button">Generate Flashcards</button>
        </div>
        <div id="flashcards-loading" class="loading-bar" hidden></div>
        <div id="flashcards-deck" class="flashcards-deck"></div>
      </div>

      <div class="tab-panel" data-panel="podcast" hidden>
        <div class="panel-actions">
          <button id="generate-podcast-btn" class="btn btn-primary" type="button">Generate Podcast</button>
        </div>
        <div id="podcast-loading" class="loading-bar" hidden></div>
        <p id="podcast-progress-text" class="podcast-progress-text" style="font-size: 13px; color: var(--text-muted, #6f6884); margin: 8px 0; text-align: center;" hidden></p>
        <div id="podcast-content" class="podcast-content"></div>
      </div>
    </section>

    <template id="flashcard-template">
      <div class="flashcard">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front"></div>
          <div class="flashcard-face flashcard-back">
            <div class="flashcard-back-content">
              <div class="flashcard-answer"></div>
              <div class="flashcard-rating-row" hidden>
                <button class="flashcard-rating-btn flashcard-rating-forgot" data-rating="forgot" type="button">Forgot</button>
                <button class="flashcard-rating-btn flashcard-rating-struggling" data-rating="struggling" type="button">Struggling</button>
                <button class="flashcard-rating-btn flashcard-rating-know" data-rating="know" type="button">Know it</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </main>

  <script src="./js/idb.js"></script>
  <script src="./js/groq-client.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/settings.js"></script>
  <script src="./js/lecture.js"></script>
  <script src="./js/sw-register.js"></script>
</body>
</html>
