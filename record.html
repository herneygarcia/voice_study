<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Voice Study" />
  <title>Recording — Voice Study</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="manifest" href="./assets/manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="./index.html">
      <svg class="brand-mark" viewBox="0 0 48 48" width="42" height="42">
        <path d="M 24 12 Q 32 18 32 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 24 8 Q 36 16 36 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
        <path d="M 24 16 Q 28 20 28 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg> Voice Study
    </a>
    <div class="nav-right">
      <a class="nav-cta" href="./record.html">+ New Lecture</a>
      <button class="nav-settings-btn" data-action="open-settings" title="Settings" style="background: none; border: none; font-size: 18px; cursor: pointer; padding: 0; margin-left: 16px;">⚙️</button>
      <img src="./img/herney.jpg" alt="Herney" class="nav-avatar" />
    </div>
  </nav>
  <main class="page">
    <section class="record-view">
      <div class="record-setup" id="record-setup">
        <label for="lecture-title">Lecture title</label>
        <input id="lecture-title" type="text" placeholder="e.g. Organic Chemistry — Lecture 4" />

        <label for="lecture-language">Language</label>
        <select id="lecture-language">
          <option value="auto">Auto-detect</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
        </select>
      </div>

      <div class="record-stage">
        <canvas id="waveform" class="waveform" width="600" height="120"></canvas>
        <button id="record-btn" class="record-btn" type="button" aria-label="Start recording">
          <span class="record-btn-inner"></span>
        </button>
        <div id="record-timer" class="record-timer">00:00</div>
        <div id="record-status" class="record-status">Tap to start recording</div>
      </div>

      <div class="transcript-live-panel">
        <h3>Live transcript</h3>
        <div id="live-transcript" class="live-transcript" aria-live="polite">
          <p class="transcript-placeholder">Your transcript will appear here as you speak…</p>
        </div>
      </div>

      <div class="record-actions">
        <button id="stop-save-btn" class="btn btn-primary btn-lg" type="button" disabled>Stop &amp; Save</button>
      </div>
    </section>
  </main>

  <script src="./js/idb.js"></script>
  <script src="./js/groq-client.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/settings.js"></script>
  <script src="./js/recorder.js"></script>
  <script src="./js/sw-register.js"></script>
</body>
</html>
